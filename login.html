<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aice Operational System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-red-600 text-white rounded-2xl text-2xl font-bold mb-4 shadow-lg shadow-red-600/30">
                A
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Aice Operational System</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masukkan password untuk mengakses aplikasi</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Password Akses</label>
                <input type="password" id="passwordInput" required placeholder="Masukkan password..." 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-slate-800 placeholder-slate-400 text-sm transition">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-lg shadow-red-600/30 transition duration-200 text-sm">
                Masuk ke Aplikasi
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-[11px] text-slate-400 italic">Protected System • by Maulani</p>
        </div>
    </div>

    <script>
        // PASSWORD UTAMA (Bisa Anda ubah di sini jika ada yang keluar)
        const PASSWORD_RAHASIA = "Aice2026"; 

        if (sessionStorage.getItem('aice_auth') === 'authenticated') {
            window.location.href = 'index.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('passwordInput').value;

            if (inputVal === PASSWORD_RAHASIA) {
                sessionStorage.setItem('aice_auth', 'authenticated');
                window.location.href = 'index.html';
            } else {
                alert('Password salah! Silakan hubungi admin (Maulani).');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }
    </script>
</body>
</html>
